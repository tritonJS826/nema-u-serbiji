<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Домашняя еда Ниша — каталог продавцов</title>
  <meta name="description" content="Домашняя еда, выпечка и заготовки от продавцов из чата «Русскоговорящий Ниш». Поиск по товарам, цены и заказ в Telegram.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6Z"/>
            <path d="M3 10h18"/>
            <path d="M9 7c0-1 1-1.5 1-3M13 7c0-1 1-1.5 1-3"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Домашняя еда Ниша</strong>
          <small>каталог продавцов из чата «Русскоговорящий Ниш»</small>
        </span>
      </a>
      <a class="header-link" href="https://t.me/rus_nis" target="_blank" rel="noopener">Чат →</a>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <div class="loading">Загружаем каталог…</div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Каталог собран из сообщений чата «Русскоговорящий Ниш Сербия» за последний год.
        Цены и наличие уточняйте у продавца. Заказ оформляется в Telegram.</p>
      <p class="muted" id="updated"></p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
